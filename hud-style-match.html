.kicker{position:absolute;left:5.4%;top:4.1%;width:86%;color:white;font-size:3.35cqw;line-height:1.23;font-weight:750;letter-spacing:-.02em;padding-left:4%;z-index:2}
.kicker::before{content:"";position:absolute;left:0;top:1%;height:94%;width:.95%;background:#ffe000;border-radius:1px}
.headline{position:absolute;top:16.5%;left:7%;right:3%;font-size:7.65cqw;font-weight:800;line-height:1.03;letter-spacing:-.055em;margin:0;color:#fbfbfd;z-index:2;white-space:nowrap}
.screen-reader-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.word-area{position:absolute;left:7%;right:2%;top:28.6%;height:18.5%;z-index:3;pointer-events:none}
.fault-word{position:absolute;left:0;top:0;display:block;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;font-size:12.9cqw;font-weight:760;font-style:italic;line-height:1.12;letter-spacing:-.065em;color:rgba(189,233,255,.94);opacity:0;filter:blur(8px);transform:skewX(-1.6deg) scale(.99);transform-origin:12% 70%;text-shadow:0 0 .65cqw rgba(166,226,255,.24),0 0 1.15cqw rgba(166,226,255,.17),0 0 2cqw rgba(116,201,255,.10);transition:opacity 1150ms cubic-bezier(.22,1,.36,1),filter 1150ms cubic-bezier(.22,1,.36,1),transform 1150ms cubic-bezier(.22,1,.36,1);will-change:opacity,filter,transform}
.fault-word.blurry:not(.is-active){filter:blur(11px);transform:scale(1.018)}
.fault-word.faded:not(.is-active){filter:blur(1.2px);transform:scale(1)}
.fault-word.distorted:not(.is-active){filter:blur(4px);transform:skewX(-6deg) scaleX(.985)}
.fault-word.is-active{opacity:1;filter:blur(0);transform:none}
.fault-word.blurry.is-active{filter:blur(.55px)}
.fault-word.faded.is-active{opacity:.79;filter:blur(.25px)}
.fault-word.distorted.is-active{filter:url(#gentle-word-warp);animation:word-waver 2.85s ease-in-out infinite alternate}
@keyframes word-waver{0%,100%{transform:skewX(-.15deg)}50%{transform:skewX(1.4deg) translateX(.25cqw)}}
.swash{position:absolute;left:7%;top:41.35%;width:42%;height:.7%;z-index:2;background:linear-gradient(90deg,#ffe600 0%,#ffe600 70%,rgba(255,214,0,0) 100%);border-radius:50%;transform:rotate(-.6deg);box-shadow:0 .2cqw .8cqw rgba(255,217,0,.43);pointer-events:none}
.summary{position:absolute;left:7%;top:46.6%;width:68%;margin:0;font-size:3.83cqw;line-height:1.22;letter-spacing:-.025em;color:#d2d5d9;font-weight:400;z-index:2}
.hud-window{position:absolute;left:45%;top:61%;width:46%;height:15%;z-index:2;overflow:visible;pointer-events:none}
.hud-layer{position:absolute;inset:0;display:flex;align-items:center;gap:7%;opacity:0;transition:opacity 1150ms cubic-bezier(.22,1,.36,1);will-change:opacity}
.hud-layer.is-active{opacity:1}
.hud-layer.blurry{filter:blur(3.1px)}
.hud-layer.faded.is-active{opacity:.19}
.hud-layer.distorted{filter:url(#gentle-hud-warp)}
.speed{display:flex;align-items:baseline;color:#BDE9FF;white-space:nowrap;text-shadow:0 0 .65cqw rgba(166,226,255,.24);font-style:italic;letter-spacing:-.04em;flex-shrink:0}
.speed-number{font-size:10.2cqw;font-weight:650;line-height:1}
.speed-unit{font-size:3.55cqw;font-weight:650;margin-left:1.1cqw}
.roadmark{height:8cqw;width:9cqw;flex-shrink:0;opacity:.9;fill:#BDE9FF;filter:drop-shadow(0 0 .35cqw rgba(186,226,255,.25))}
.hud-layer.distorted .speed{text-shadow:-.32cqw 0 rgba(255,65,110,.32),.28cqw 0 rgba(0,220,255,.38)}
.foot{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:12px;color:#aab0b9;font-size:13px;line-height:1.45}
.foot p{margin:0}
button{font:inherit;flex-shrink:0;border:1px solid #454b54;border-radius:7px;background:#14181e;color:white;padding:7px 12px;cursor:pointer}
button:hover{background:#252b33}button:focus-visible{outline:2px solid #ffde00;outline-offset:2px}
@media(max-width:460px){body{padding:8px}.poster{border-radius:6px}.foot{font-size:11px}}
@media(prefers-reduced-motion:reduce){.fault-word,.hud-layer{transition:none!important;animation:none!important}.word-area .faded,.word-area .distorted{display:none}.fault-word.blurry{opacity:1!important;filter:none!important;transform:none!important}.hud-layer.blurry{opacity:1!important;filter:none!important}.hud-layer.faded,.hud-layer.distorted{display:none}.swash{box-shadow:none}}
</style>

  <svg class="screen-reader-only" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter id="gentle-word-warp" x="-12%" y="-18%" width="126%" height="145%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.045" numOctaves="1" seed="6" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="gentle-hud-warp" x="-14%" y="-18%" width="129%" height="145%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.025 0.06" numOctaves="2" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
</main>
<script>
(()=>{
  'use strict';
  const modes=['blurry','faded','distorted'];
  const duration=3000; // each word has a three-second slot
  const words=[...document.querySelectorAll('.fault-word')];
  const hud=[...document.querySelectorAll('.hud-layer')];
  const toggle=document.getElementById('toggleMotion');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let step=0, timer=null, entrance=null, paused=reduceMotion.matches;
  const activate=(mode)=>{
    words.forEach(el=>el.classList.toggle('is-active',el.dataset.mode===mode));
    hud.forEach(el=>el.classList.toggle('is-active',el.dataset.mode===mode));
  };
  function advance(){
    step=(step+1)%modes.length;
    // One atomic state change: the headline and its HUD display animate in the same browser frame.
    activate(modes[step]);
  }
  function start(){
    window.clearInterval(timer);
    if(!reduceMotion.matches){timer=window.setInterval(advance,duration);paused=false;toggle.textContent='Pause';toggle.setAttribute('aria-pressed','false')}
  }
  function stop(){window.clearInterval(timer);window.clearTimeout(entrance);timer=null;entrance=null;paused=true;activate(modes[step]);toggle.textContent='Play';toggle.setAttribute('aria-pressed','true')}
  toggle.addEventListener('click',()=>{if(paused){start()}else{stop()}});
  reduceMotion.addEventListener?.('change',e=>{if(e.matches){stop();step=0;activate('blurry')}else{start()}});
  activate('blurry');
  if(reduceMotion.matches){stop()} else {start()}
})();
</script>
</body>
</html>
